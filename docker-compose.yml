services:
  # REST API + transfer agent. Reached only through the caddy proxy.
  # Image published to GHCR by the sb-ctrl repo on each release.
  sb-ctrl:
    image: ghcr.io/grigoriev/sb-ctrl:0.3.3@sha256:dd16878c7110178f5df61a09ac44a01835d31410307df5486238732c233b5c05
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./config/config.toml:/config/config.toml:ro
      - ./secrets/ssh:/root/.ssh:ro
      # Staging and the Plex library roots. Must be one filesystem (atomic move).
      - ${MEDIA_ROOT}:/data
      # Resolve the perms owner/group names (e.g. "plex") to host ids.
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
    networks: [internal]

  # Static single-page UI. Reached only through the caddy proxy.
  # Image published to GHCR by the sb-ctrl-ui repo on each release.
  sb-ctrl-ui:
    image: ghcr.io/grigoriev/sb-ctrl-ui:0.3.0@sha256:a7f8d2eaa9db52ce74568382e461112f073bbef9508dea9ed920e58ead00f314
    restart: unless-stopped
    networks: [internal]

  # TLS termination + reverse proxy. Custom build adds the IONOS DNS plugin
  # so certificates issue over DNS-01 (the host is VPN-only, HTTP-01 fails).
  caddy:
    build:
      context: ./caddy
    restart: unless-stopped
    env_file: .env
    ports:
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]
    depends_on: [sb-ctrl, sb-ctrl-ui]

networks:
  internal:

volumes:
  caddy_data:
  caddy_config:
