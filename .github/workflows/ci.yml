name: CI

on:
  push:
    branches: ["main", "renovate/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare env
        run: cp .env.example .env
      - name: Validate compose
        run: docker compose config -q
